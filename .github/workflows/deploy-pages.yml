name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.18.1
          cache: npm

      - name: Set up npm
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm run check

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build application
        run: npm run build -- --base "${{ steps.pages.outputs.base_path }}/"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Notify search engines through IndexNow
        run: |
          curl --fail-with-body --retry 2 --get "https://api.indexnow.org/indexnow" \
            --data-urlencode "url=https://avin.github.io/svg-qr-builder/" \
            --data-urlencode "key=7e6f2f7705db47d7a0c4de9c4b8ebfd8" \
            --data-urlencode "keyLocation=https://avin.github.io/svg-qr-builder/7e6f2f7705db47d7a0c4de9c4b8ebfd8.txt"
